apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle
  namespace: payment-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oracle
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: oracle
    spec:
      containers:
      - name: oracle
        image: gvenzl/oracle-xe:21-slim
        ports:
        - containerPort: 1521
          name: oracle
        env:
        - name: ORACLE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payment-secrets
              key: ORACLE_PASSWORD
        - name: APP_USER
          value: "payment"
        - name: APP_USER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payment-secrets
              key: ORACLE_APP_PASSWORD
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: oracle-data
          mountPath: /opt/oracle/oradata
        readinessProbe:
          exec:
            command:
            - healthcheck.sh
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        livenessProbe:
          exec:
            command:
            - healthcheck.sh
          initialDelaySeconds: 120
          periodSeconds: 60
          timeoutSeconds: 10
      volumes:
      - name: oracle-data
        persistentVolumeClaim:
          claimName: oracle-pvc
