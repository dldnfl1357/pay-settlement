apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: payment-system
spec:
  selector:
    app: payment-service
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service-external
  namespace: payment-system
spec:
  selector:
    app: payment-service
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
  type: NodePort
