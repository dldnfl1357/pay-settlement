apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-config
  namespace: payment-system
data:
  # Oracle Configuration (Default)
  ORACLE_HOST: "oracle"
  ORACLE_PORT: "1521"
  ORACLE_SERVICE: "XEPDB1"
  # MySQL Configuration (for mysql profile)
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "payment_db"
  # Redis Configuration
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  # Kafka Configuration
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
