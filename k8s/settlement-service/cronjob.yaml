apiVersion: batch/v1
kind: CronJob
metadata:
  name: settlement-batch
  namespace: payment-system
spec:
  schedule: "0 1 * * *"  # 매일 01:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: settlement-batch
            image: settlement-service:latest
            imagePullPolicy: IfNotPresent
            command:
            - "java"
            - "-jar"
            - "-Dspring.batch.job.names=settlementJob"
            - "app.jar"
            env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes,batch"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: payment-secrets
                  key: MYSQL_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-secrets
                  key: MYSQL_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            resources:
              requests:
                memory: "512Mi"
                cpu: "250m"
              limits:
                memory: "1Gi"
                cpu: "500m"
          restartPolicy: OnFailure
