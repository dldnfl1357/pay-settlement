apiVersion: v1
kind: Service
metadata:
  name: settlement-service
  namespace: payment-system
spec:
  selector:
    app: settlement-service
  ports:
  - port: 8081
    targetPort: 8081
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: settlement-service-external
  namespace: payment-system
spec:
  selector:
    app: settlement-service
  ports:
  - port: 8081
    targetPort: 8081
    nodePort: 30081
  type: NodePort
